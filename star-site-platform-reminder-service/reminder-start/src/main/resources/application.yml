server:
  port: 8086

spring:
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  # 邮件触达渠道：配齐 host/username/password 即启用（如 QQ 邮箱 SMTP 授权码）；不配则仅站内信
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  application:
    name: star-site-platform-reminder
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

# MyBatis 官方（替代 MyBatis-Plus）：mapper XML 在 reminder-dal，驼峰自动映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 健康聚焦阶段 MQ 停用：降级为纯 @Scheduled 扫描（架构 D6 降级开关）
# 启用事件消费：取消注释并启动 rocketmq 容器
# rocketmq:
#   name-server: 127.0.0.1:9876
#   consumer:
#     group: G_reminder_reminder

# 提醒调度：每天 08:00 补生成实例并投递当天通知
reminder:
  scan-cron: "0 0 8 * * ?"
  # 预生成未来 N 天的实例
  generate-days: 30

jwt:
  # HS256 密钥，须 >= 32 字节；与网关/其他服务保持一致，生产环境用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info


# RPC 集成（integration 层统一门卫 RpcCallGuard）：间调用超时基线，nacos yaml / compose env 可覆盖
star:
  rpc:
    timeout:
      connect-ms: 3000
      read-ms: 10000
