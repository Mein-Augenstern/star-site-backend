server:
  port: 8080

spring:
  application:
    name: star-site-gateway
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
    gateway:
      routes:
        - id: member-route
          uri: lb://star-site-member
          predicates:
            - Path=/api/auth/**,/api/member/**
        - id: family-route
          uri: lb://star-site-family
          predicates:
            - Path=/api/family/**
        - id: file-route
          uri: lb://star-site-file
          predicates:
            - Path=/api/file/**
        - id: health-route
          uri: lb://star-site-health
          predicates:
            - Path=/api/health/**
      # 跨域统一在网关处理
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600

jwt:
  # 与各下游服务保持一致；生产用环境变量注入
  secret: "star-site-local-dev-secret-change-me-32bytes!"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info
