server:
  port: 8088

spring:
  application:
    name: star-site-biz-finance
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 逻辑删为显式 SQL 约定：查询一律 AND deleted=0，删除=UPDATE SET deleted=1（见 dal mapper XML）

# 健康聚焦阶段 MQ 停用：账单导入走同步接口，EventPublisher 降级为 Noop
# 启用事件消费：取消注释并启动 rocketmq 容器（FinanceMqConfig 条件装配消费者）
# rocketmq:
#   name-server: 127.0.0.1:9876
#   consumer:
#     group: G_finance_file

jwt:
  # HS256 密钥，须 >= 32 字节；与网关/其他服务保持一致，生产环境用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info


# RPC 集成（integration 层统一门卫 RpcCallGuard）：间调用超时基线，nacos yaml / compose env 可覆盖
star:
  rpc:
    timeout:
      connect-ms: 3000
      read-ms: 10000

# starsite-lock 组件（每日净资产快照的多实例防重跑门控）
# db 模式复用本服务 MyBatis + DataSource；锁行主键由 starsite-sequence 发号；表自动创建（IF NOT EXISTS）
starsite:
  lock:
    mode: db
    # 快照对全部 owner 逐个落行，执行时长可能超默认 30s——TTL 放宽到 10 分钟
    # （锁过期后他方进入的场景由 uk(owner, date) 幂等吸收）
    ttl-ms: 600000
