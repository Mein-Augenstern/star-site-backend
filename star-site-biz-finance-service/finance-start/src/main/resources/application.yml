server:
  port: 8088

spring:
  application:
    name: star-site-biz-finance
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 健康聚焦阶段 MQ 停用：账单导入走同步接口，EventPublisher 降级为 Noop
# 启用事件消费：取消注释并启动 rocketmq 容器（FinanceMqConfig 条件装配消费者）
# rocketmq:
#   name-server: 127.0.0.1:9876
#   consumer:
#     group: G_finance_file

llm:
  # AI 财务诊断（智谱 GLM，OpenAI 兼容协议）；未配 api-key 时接口返回"未启用"提示
  base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:glm-4-flash}

jwt:
  # HS256 密钥，须 >= 32 字节；与网关/其他服务保持一致，生产环境用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info
