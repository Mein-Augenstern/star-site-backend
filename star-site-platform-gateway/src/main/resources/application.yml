server:
  port: 8080

spring:
  application:
    name: star-site-platform-gateway
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
    gateway:
      routes:
        - id: bench-route
          uri: lb://bench-service
          predicates:
            - Path=/api/bench/**
        - id: admin-async-route
          uri: lb://star-site-biz-health
          predicates:
            - Path=/api/admin/async/**
        - id: member-route
          uri: lb://star-site-platform-member
          predicates:
            - Path=/api/auth/**,/api/member/**,/api/admin/**
        - id: family-route
          uri: lb://star-site-biz-family
          predicates:
            - Path=/api/family/**
        - id: file-route
          uri: lb://star-site-platform-file
          predicates:
            - Path=/api/file/**
        - id: health-route
          uri: lb://star-site-biz-health
          predicates:
            - Path=/api/health/**
        - id: insurance-route
          uri: lb://star-site-biz-insurance
          predicates:
            - Path=/api/insurance/**
        - id: reminder-route
          uri: lb://star-site-platform-reminder
          predicates:
            - Path=/api/reminder/**
        - id: archive-route
          uri: lb://star-site-biz-archive
          predicates:
            - Path=/api/archive/**
        - id: finance-route
          uri: lb://star-site-biz-finance
          predicates:
            - Path=/api/finance/**
        - id: recheck-route
          uri: lb://star-site-biz-recheck
          predicates:
            - Path=/api/recheck/**
        - id: payment-route
          uri: lb://star-site-platform-payment
          predicates:
            - Path=/api/payment/**
        - id: ai-route
          uri: lb://star-site-platform-ai
          predicates:
            - Path=/api/ai/**
        # invest 个人投资微服务（Python/FastAPI）。上游默认容器内访问宿主机进程；
        # 宿主机直接跑网关时设 INVEST_UPSTREAM=http://127.0.0.1:8790
        # 鉴权：网关 JwtGlobalFilter 统一校验 + invest 服务内 star JWT 纵深防御
        - id: invest-route
          uri: "${INVEST_UPSTREAM:http://host.docker.internal:8790}"
          predicates:
            - Path=/api/invest/**
      # 跨域统一在网关处理
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600

jwt:
  # 与各下游服务保持一致；生产用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info

# starsite 组件禁用：网关是 WebFlux 无 DB 服务——async-command(jdbc 形态)与 lock(db 模式)
# 均需 DataSource/MyBatis，不关会在装配期快速失败。发号组件保留（无 DB 回落 hash 机器位，可用）。
starsite:
  async-command:
    enabled: false
  lock:
    enabled: false
