server:
  port: 8084

spring:
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  application:
    name: star-site-biz-health
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info

llm:
  # AI 解读（智谱 GLM，OpenAI 兼容协议）；未配 api-key 时接口返回"未启用"提示
  base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:glm-4-flash}

jwt:
  # HS256 密钥，须 >= 32 字节；与网关/其他服务保持一致，生产环境用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720


# RPC 集成（integration 层统一门卫 RpcCallGuard）：间调用超时基线，nacos yaml / compose env 可覆盖
star:
  rpc:
    timeout:
      connect-ms: 3000
      read-ms: 10000
