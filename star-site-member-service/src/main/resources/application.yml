server:
  port: 8081

spring:
  application:
    name: star-site-member
  # 从 Nacos 配置中心拉取（optional：nacos 里没配置也不阻塞启动）
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # HS256 密钥，须 >= 32 字节；生产环境务必换成环境变量注入
  secret: "star-site-local-dev-secret-change-me-32bytes!"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info
