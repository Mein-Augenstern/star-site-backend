server:
  port: 8090

spring:
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  application:
    name: star-site-platform-payment
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info

jwt:
  # HS256 密钥，须 >= 32 字节；与网关/其他服务保持一致，生产环境用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

# —— 支付渠道（军规：渠道密钥一律环境变量/配置中心注入，禁入库禁入仓）——
star:
  rpc:
    timeout:
      connect-ms: 3000
      read-ms: 10000
  payment:
    # 渠道服务器回调基地址（拼接 /api/payment/notify/{channel}）；本地开发走 frp 隧道，域名就绪后替换
    notify-url: ${PAYMENT_NOTIFY_URL:https://***REMOVED-ECS-IP***:9090/api/payment/notify}
    # mock 沙箱渠道（默认启用；生产置 false 后 mock 下单即报不支持渠道）
    mock:
      enabled: ${PAYMENT_MOCK_ENABLED:true}
      secret: ${PAYMENT_MOCK_SECRET:star-site-mock-payment-secret-dev-only}
    # 支付宝（当面付扫码）：@ConditionalOnProperty 按 app-id 是否存在装配——
    # 密钥不经 yml 默认值（空串会被判定为已配置），接入时在 nacos yaml/compose env 补齐以下键：
    #   star.payment.alipay.app-id / private-key / alipay-public-key
    #   star.payment.alipay.gateway-url（沙箱覆盖为 https://openapi-sandbox.dl.alipaydev.com/gateway）
    # 微信支付 Native（v3）同规则，接入时补齐：
    #   star.payment.wechat.merchant-id / merchant-serial-no / private-key-path / api-v3-key / app-id
