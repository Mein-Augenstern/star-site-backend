server:
  port: 8081

spring:
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  application:
    name: star-site-platform-member
  # 从 Nacos 配置中心拉取（optional：nacos 里没配置也不阻塞启动）
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    # HikariCP 调优（2026-11-10：36h 连接池耗尽 → 登录全线超时，实证加配置）
    hikari:
      maximum-pool-size: 5            # 个人工具，5 个连接足够
      minimum-idle: 1                 # 平时只保持 1 个空闲连接
      connection-timeout: 5000        # 5 秒拿不到就报错（默认 30s 太长）
      leak-detection-threshold: 60000 # 60 秒未归还 → WARN 日志（提前发现泄漏）
      max-lifetime: 600000            # 10 分钟强制回收（默认 30min，Mac 环境太长）
      keepalive-time: 120000          # 每 2 分钟心跳（防 Mac 休眠 TCP 断裂）

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # HS256 密钥，须 >= 32 字节；生产环境务必换成环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info

# 微信小程序登录（WX_MP_SECRET 配置真实 secret；留空走 mock 通道）
wx:
  mp:
    appid: ${WX_MP_APPID:}
    secret: ${WX_MP_SECRET:}


# RPC 集成（integration 层统一门卫 RpcCallGuard）：间调用超时基线，nacos yaml / compose env 可覆盖
star:
  rpc:
    timeout:
      connect-ms: 3000
      read-ms: 10000
