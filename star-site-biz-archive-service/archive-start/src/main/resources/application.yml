server:
  port: 8087

spring:
  # 虚拟线程（JDK 21）：以协程获得响应式吞吐，无需 WebFlux 化
  threads:
    virtual:
      enabled: true
  application:
    name: star-site-biz-archive
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        # 本地开发强制注册 127.0.0.1（网段变化时 LB 才连得通）；生产去掉用真实 IP
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机原生 MySQL 占用，docker MySQL 映射在 3307
    url: jdbc:mysql://127.0.0.1:3307/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

# MyBatis 官方（替代 MyBatis-Plus）：mapper XML 在 archive-dal，驼峰自动映射；
# 逻辑删（archive_document/archive_asset.deleted）已显式写进各条 SQL
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 健康聚焦阶段 MQ 停用：归档事件发布降级为 Noop
# 启用事件发布：取消注释并启动 rocketmq 容器
# rocketmq:
#   name-server: 127.0.0.1:9876
#   producer:
#     group: G_archive_producer

jwt:
  # HS256 密钥，须 >= 32 字节；与网关/其他服务保持一致，生产环境用环境变量注入
  secret: "${JWT_SECRET:star-site-local-dev-secret-change-me-32bytes!}"
  expire-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xp.starsite: info
