# RocketMQ 单机 broker（本地开发）
# brokerIP1 必须写宿主机可达地址：业务服务跑在宿主机，broker 注册到
# namesrv 的地址若是容器内 IP，客户端连不上（经典坑）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48
brokerIP1 = 192.168.31.254
# 开发环境自动建 topic，省去手动创建
autoCreateTopicEnable = true
