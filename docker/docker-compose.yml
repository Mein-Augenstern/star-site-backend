# star-site 本地开发基础设施（生产部署到 ECS 时再调内存参数）
services:
  mysql:
    image: mysql:8.0
    # 国内环境：镜像已通过加速源拉取并 retag，禁止 compose 再去 Docker Hub 拉
    pull_policy: never
    container_name: star-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: star_site
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=100
    ports:
      - "3307:3306"   # 宿主机 3306 被本机原生 MySQL 占用，容器映射到 3307
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    pull_policy: never
    container_name: star-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "6379:6379"
    mem_limit: 192m
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.2
    pull_policy: never
    container_name: star-nacos
    environment:
      MODE: standalone          # 单机 + 内嵌 Derby，不占 MySQL
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 96m
      NACOS_AUTH_ENABLE: "false"  # 本地开发关鉴权；公网部署必须开启并改默认密钥
    ports:
      - "8848:8848"   # HTTP 控制台/OpenAPI
      - "9848:9848"   # gRPC（nacos-client 2.x 必需）
    mem_limit: 384m
    restart: unless-stopped

volumes:
  mysql-data:
