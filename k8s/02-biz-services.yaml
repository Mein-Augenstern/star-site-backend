# 业务域服务：insurance / reminder / archive / finance（均依赖 broker，MQ env 已在 ConfigMap）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance
  namespace: star-site
spec:
  replicas: 1
  selector:
    matchLabels: { app: insurance }
  template:
    metadata:
      labels: { app: insurance }
    spec:
      containers:
        - name: app
          image: star-site/biz-insurance:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: star-site-config }
            - secretRef: { name: star-site-secret }
          env:
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_IP, value: insurance }
          ports: [{ containerPort: 8085 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8085 }, initialDelaySeconds: 30 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8085 }, initialDelaySeconds: 60 }
          resources:
            limits: { memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: insurance
  namespace: star-site
spec:
  selector: { app: insurance }
  ports: [{ port: 8085, targetPort: 8085 }]
---
