# namespace + 公共配置 + 密钥
apiVersion: v1
kind: Namespace
metadata:
  name: star-site
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-site-config
  namespace: star-site
data:
  SPRING_CLOUD_NACOS_SERVER_ADDR: star-nacos:8848
  SPRING_DATASOURCE_URL: jdbc:mysql://star-mysql:3306/star_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  ROCKETMQ_NAME_SERVER: star-rocketmq-namesrv:9876
  TZ: Asia/Shanghai
---
apiVersion: v1
kind: Secret
metadata:
  name: star-site-secret
  namespace: star-site
type: Opaque
stringData:
  # 生产：kubectl create secret 重新生成，勿提交真实密钥
  SPRING_DATASOURCE_PASSWORD: root123
  JWT_SECRET: change-me-to-a-random-32bytes-secret!
