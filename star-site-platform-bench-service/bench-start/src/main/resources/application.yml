spring:
  application:
    name: bench-service
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:localhost}:8848
      discovery:
        namespace: public
  datasource:
    # connectTimeout/socketTimeout（故障注入实证的根因修复）：Docker 端口代理在容器停止后
    # 仍接受 TCP 但不转发，驱动默认 connectTimeout=0（无限）→ 请求静默挂死、actuator/health
    # 挂死（编排器将连环重启 Pod）。加超时后 DB 故障 5s 内显性报错（lock fail-open 语义可控），
    # socketTimeout=30s 防执行中挂起无限占用 Tomcat 线程
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3307/star_site?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 极限摸高结论（见 components docs/full-benchmark.md）：默认池 10 在 128 并发下
      # 打满且 ~112 请求排队（吞吐平台 ~390 ops/s、P99 769ms）；压测形态调至 20，
      # 生产按「实例数×池 ≤ MySQL max_connections(200)」约束配置
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# lock 的 mysql 形态经 MyBatis mapper（ScheduleLockMapper）实现，需保留 mapper XML 扫描
mybatis:
  mapper-locations: classpath:com/xp/starsite/**/mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 三组件压测配置（默认 MySQL 形态；可通过环境变量切换）
starsite:
  sequence:
    mode: mysql
    service-name: bench-service
  async-command:
    mode: mysql
  lock:
    mode: mysql

# star-site-common 的 JwtUtil 需要（压测服务不做鉴权，仅占位满足装配）
jwt:
  secret: "${JWT_SECRET:bench-service-local-secret-32bytes-000000!}"
  expire-minutes: 720

server:
  port: 18090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.xp.starsite: info
