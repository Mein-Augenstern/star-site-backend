spring:
  application:
    name: bench-service
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:localhost}:8848
      discovery:
        namespace: public
  datasource:
    # 分片形态（distributed-sharding.md 路线 A · ShardingSphere Proxy 5.4.1 独立进程）：
    # 应用视 proxy 为普通 MySQL（逻辑库 sharding_db），三组件依赖与 SQL 零改动——
    # 路由/改写/广播全在 proxy 层（lock_name/biz_key 精确路由单片，认领/回收广播全分片）。
    # 嵌入式 JDBC 形态与 Boot 3.2 同 classpath 存在 snakeyaml/JAXB/classpath sql 目录扫描
    # 三重冲突（实装实证），proxy 形态是零侵入的正确集成边界。
    # 直连真库跑单表形态时改回 :3307/star_site（BENCH_DB_URL 覆盖）。
    # connectTimeout/socketTimeout 超时铁律保留（故障注入实证 OBS-106）。
    url: ${BENCH_DB_URL:jdbc:mysql://localhost:13307/sharding_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 极限摸高结论（见 components docs/full-benchmark.md）：默认池 10 在 128 并发下
      # 打满且 ~112 请求排队（吞吐平台 ~390 ops/s、P99 769ms）；压测形态调至 20，
      # 生产按「实例数×池 ≤ MySQL max_connections(200)」约束配置
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# lock 的 mysql 形态经 MyBatis mapper（ScheduleLockMapper）实现，需保留 mapper XML 扫描
mybatis:
  mapper-locations: classpath:com/xp/starsite/**/mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 三组件压测配置（默认 MySQL 形态；可通过环境变量切换）
starsite:
  sequence:
    mode: mysql
    service-name: bench-service
  async-command:
    mode: mysql
    # 终态行清理（OBS-111，loop 压测实证单日堆近 4000 行）：bench 保留 0 天即时清终态，
    # 生产按对账需求设保留期（默认关，开启后每小时低频批量两步法清理）
    retention-enabled: true
    retention-days: 0
  lock:
    mode: mysql

# star-site-common 的 JwtUtil 需要（压测服务不做鉴权，仅占位满足装配）
jwt:
  secret: "${JWT_SECRET:bench-service-local-secret-32bytes-000000!}"
  expire-minutes: 720

server:
  port: 18090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.xp.starsite: info
